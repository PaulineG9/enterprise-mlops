name: MLOps CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint-and-test:
    name: Lint & Unit Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint with flake8
        run: |
          flake8 src/ scripts/ tests/ --config=.flake8

      - name: Run unit tests
        run: |
          pytest tests/ -v --junitxml=pytest-results.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results
          path: pytest-results.xml

  pipeline-smoke-test:
    name: End-to-End Pipeline Smoke Test (pandas fallback)
    needs: lint-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate synthetic telemetry data
        run: python scripts/generate_mock_data.py --assets 300 --readings-per-asset 30

      - name: Run ETL feature engineering (pandas fallback -- no Spark cluster in CI)
        run: python src/etl_pipeline.py --force-pandas

      - name: Train and evaluate model
        run: python src/train.py --features data/processed/asset_features/asset_features.parquet

      - name: Upload trained model artifact
        uses: actions/upload-artifact@v4
        with:
          name: trained-model
          path: models/

  deploy:
    name: Deploy to Azure ML (Managed Online Endpoint)
    needs: pipeline-smoke-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deployment dependencies
        run: pip install azure-ai-ml azure-identity requests

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy registered model to managed online endpoint
        run: |
          python src/deploy.py \
            --model-name asset-failure-risk-classifier \
            --model-version ${{ github.run_number }} \
            --endpoint-name asset-risk-endpoint \
            --subscription-id ${{ secrets.AZURE_SUBSCRIPTION_ID }} \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --workspace-name ${{ secrets.AZURE_WORKSPACE_NAME }}

      - name: Smoke-test the live endpoint
        run: |
          python scripts/test_endpoint.py \
            --url ${{ secrets.ENDPOINT_SCORING_URL }} \
            --api-key ${{ secrets.ENDPOINT_API_KEY }}
